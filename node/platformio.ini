; WashWatch washer node firmware (classic ESP32). One env per washer.
; pio run -d node -e washer1 -t upload -t monitor

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
lib_deps =
  bblanchon/ArduinoJson@^7.2.1  ; needed by lib/ww_proto
build_flags = -I ..

[env:washer1]
build_flags = ${env.build_flags} -DNODE_ID=1

[env:washer2]
build_flags = ${env.build_flags} -DNODE_ID=2 -DNO_BROWNOUT  ; this board browns out when the radio starts

; Raw vibration logger for recording a real cycle (see README "Recording a cycle")
[env:logger]
build_src_filter = -<*> +<imu.cpp> +<../logger/>
monitor_filters = log2file
