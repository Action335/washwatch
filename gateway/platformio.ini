; WashWatch gateway firmware (classic ESP32, same board as the nodes).
; pio run -d gateway -t upload -t monitor

[env:gateway]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
build_flags = -I ..
lib_extra_dirs = ../lib
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  knolleary/PubSubClient@^2.8
  madhephaestus/ESP32Servo@^3.0.5
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
monitor_speed = 115200

; Hardware check: prints PIR / rain / DHT every 500 ms and sweeps each servo (send 's' to repeat).
[env:hwtest]
extends = env:gateway
build_src_filter = -<*> +<../hwtest/>

; Wokwi test build: two simulated washer nodes, Wokwi's open Wi-Fi, real NETPIE (from secrets.h).
; Add -DSIM_OUTAGE to cut the cloud off from 20 s to 50 s of uptime (E4 test).
[env:gateway_sim]
extends = env:gateway
build_flags = ${env:gateway.build_flags} -DSIM_NODES -DDHT_TYPE=DHT22 -DWIFI_SSID_OVERRIDE=\"Wokwi-GUEST\"

; Store-and-forward check on real Wi-Fi and NETPIE: boots with 120 records queued (node 9, no Feed datatags).
[env:gateway_backlog]
extends = env:gateway
build_flags = ${env:gateway.build_flags} -DSIM_BACKLOG=120
