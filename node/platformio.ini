; AirBox sensor node firmware. One env per node role.
; pio run -d node -e indoor -t upload -t monitor

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  claws/BH1750@^1.3.0
  bblanchon/ArduinoJson@^7.2.1  ; needed by lib/airbox_proto
build_flags = -I ..

[env:indoor]
build_flags = ${env.build_flags} -DNODE_ID=1 -DHAS_DHT=1 -DHAS_MQ=1

[env:outdoor]
build_flags = ${env.build_flags} -DNODE_ID=2 -DHAS_DHT=1 -DHAS_LUX=1

[env:sim]
build_flags = ${env.build_flags} -DSIMULATED=1  ; sends as node IDs 3 and 4
